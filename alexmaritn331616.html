<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | alexmaritn331616</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar / Header -->
    <header class="navbar admin-nav">
        <div class="logo">⚡ Admin Panel <span>(alexmaritn331616)</span></div>
        <nav>
            <a href="index.html">← Back to Main Site</a>
            <button onclick="logoutAdmin()" class="btn danger-btn">Logout</button>
        </nav>
    </header>

    <div class="container admin-container">
        <h2>Dashboard Overview</h2>
        
        <!-- Metrics Row -->
        <div class="grid metrics-grid">
            <div class="card metric-card">
                <h4>Registered Users</h4>
                <p class="metric-number" id="admin-user-count">0</p>
            </div>
            <div class="card metric-card">
                <h4>Server Status</h4>
                <p class="metric-number green">Online</p>
            </div>
            <div class="card metric-card">
                <h4>Security Mode</h4>
                <p class="metric-number" style="color: var(--accent);">Active</p>
            </div>
        </div>

        <!-- Management Table -->
        <div class="card table-card">
            <div class="table-header">
                <h3>System Logs & Activity</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Event Type</th>
                        <th>Details</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="admin-logs-body">
                    <tr>
                        <td>System Init</td>
                        <td>Admin panel alexmaritn331616 loaded successfully.</td>
                        <td>Just now</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
