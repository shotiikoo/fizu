<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Web Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access your dashboard</p>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn primary-btn full-width">Log In</button>
        </form>

        <p class="auth-redirect">Don't have an account? <a href="register.html">Register</a></p>
        <p class="auth-redirect" style="margin-top: 0.5rem;"><a href="index.html">← Back to Home</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
