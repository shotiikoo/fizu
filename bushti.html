<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Fizu - Elite Multiplier</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-dark: #03050c;
            --panel-bg: rgba(13, 18, 33, 0.85);
            --border-glow: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --accent-magenta: #ff0080;
            --success: #00e676;
            --danger: #ff2a5f;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 30px 20px;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(121, 40, 202, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 128, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.12) 0%, transparent 60%);
            z-index: -2;
            filter: blur(40px);
        }

        .ambient-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .casino-cabinet {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 32px;
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .wallet-card {
            background: rgba(6, 10, 22, 0.9);
            border: 1px solid var(--border-glow);
            padding: 10px 22px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .wallet-card span { font-size: 11px; text-transform: uppercase; color: var(--text-sub); font-weight: 800; letter-spacing: 1px; }
        .wallet-card strong { font-size: 20px; font-weight: 900; color: var(--accent-cyan); }

        /* Recent Rounds History Bar */
        .history-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 10, 22, 0.6);
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
            white-space: nowrap;
        }

        .history-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .history-pill {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            display: inline-block;
        }
        .history-pill.win { background: rgba(0, 230, 118, 0.15); color: var(--success); border-color: rgba(0, 230, 118, 0.3); }
        .history-pill.bust { background: rgba(255, 42, 95, 0.15); color: var(--danger); border-color: rgba(255, 42, 95, 0.3); }

        /* Stage Viewport */
        .stage-viewport {
            position: relative;
            width: 100%;
            height: 380px;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.8) 0%, rgba(3, 5, 12, 0.95) 100%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.95);
        }

        canvas#gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-multiplier {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .hud-status-badge {
            position: absolute;
            top: 24px;
            left: 28px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel-box {
            background: rgba(6, 10, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-row input {
            flex: 1;
            background: rgba(13, 18, 33, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            padding: 12px 18px;
            border-radius: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-row input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .q-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 8px 0;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .q-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .q-btn:active { transform: translateY(1px); }

        .action-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-giant {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .btn-bet {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
            color: #fff;
            box-shadow: 0 12px 30px rgba(255, 0, 128, 0.35);
        }
        .btn-bet:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-bet:active { transform: translateY(1px); }

        .btn-inflate {
            background: linear-gradient(135deg, var(--accent-cyan), #4facfe);
            color: #03050c;
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.35);
            display: none;
        }
        .btn-inflate:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-inflate:active { transform: translateY(1px); }

        .btn-cashout {
            background: linear-gradient(135deg, var(--success), #00b0ff);
            color: #03050c;
            box-shadow: 0 12px 30px rgba(0, 230, 118, 0.35);
            display: none;
        }
        .btn-cashout:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-cashout:active { transform: translateY(1px); }

        .win-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
            padding: 14px 20px;
            border-radius: 14px;
        }

        .win-display span { font-size: 12px; color: var(--success); font-weight: 800; text-transform: uppercase; }
        .win-display strong { font-size: 22px; color: var(--success); font-weight: 900; }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

    <div class="casino-cabinet">
        <header class="header">
            <div class="brand-title">👑 CASINO FIZU</div>
            <div class="wallet-card">
                <span>BALANCE</span>
                <strong>$<span id="balanceVal">100.00</span></strong>
            </div>
        </header>

        <!-- Last 20 Rounds History Bar -->
        <div class="history-bar" id="historyBar">
            <span class="history-label">History:</span>
            <span style="color: var(--text-sub); font-size: 12px;">No rounds played yet</span>
        </div>

        <div class="stage-viewport">
            <div class="hud-status-badge" id="statusBadge">READY TO PLAY</div>
            <div class="hud-multiplier" id="topMult">1.00x</div>
            <canvas id="gameCanvas" width="830" height="380"></canvas>
        </div>

        <div class="dashboard-grid">
            <div class="panel-box">
                <div class="panel-label">WAGER AMOUNT ($)</div>
                <div class="input-row">
                    <input type="number" id="betInput" value="10" min="1" max="10000">
                </div>
                <div class="quick-bets">
                    <button class="q-btn" onclick="setBet(5)">$5</button>
                    <button class="q-btn" onclick="setBet(10)">$10</button>
                    <button class="q-btn" onclick="setBet(25)">$25</button>
                    <button class="q-btn" onclick="setBet(50)">$50</button>
                    <button class="q-btn" onclick="modBet(0.5)">½x</button>
                    <button class="q-btn" onclick="modBet(2)">2x</button>
                </div>
            </div>

            <div class="panel-box">
                <div class="win-display">
                    <span>POTENTIAL WINNINGS</span>
                    <strong>$<span id="winVal">0.00</span></strong>
                </div>

                <div class="action-area" style="margin-top: 12px;">
                    <button class="btn-giant btn-bet" id="betBtn" onclick="startBet()">PLACE BET</button>
                    <button class="btn-giant btn-inflate" id="pumpBtn" onclick="pumpAir()">PUMP PRESSURE ⚡ (Next: <span id="nextX">1.18x</span>)</button>
                    <button class="btn-giant btn-cashout" id="cashoutBtn" onclick="cashOut()">CASH OUT ($<span id="cashVal">0.00</span>)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Synthesizer
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } 
                else if (type === 'pump') {
                    // Crisp, clean high-tech mechanical pump stroke (dual-harmonic chirp + sharp valve click)
                    let osc = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc2.type = 'sine';

                    let startFreq = 180 + Math.min(stepCount * 12, 180);
                    let endFreq = 420 + Math.min(stepCount * 25, 350);

                    osc.frequency.setValueAtTime(startFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.06);

                    osc2.frequency.setValueAtTime(startFreq * 1.5, now);
                    osc2.frequency.exponentialRampToValueAtTime(endFreq * 1.5, now + 0.06);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                    osc.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc2.start(now);
                    osc.stop(now + 0.06);
                    osc2.stop(now + 0.06);
                } 
                else if (type === 'cashout') {
                    // 8-Bit Retro Arcade Victory Fanfare (Square wave arpeggio + crystal chime finish)
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        let t = now + (i * 0.06);

                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, t);

                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(t);
                        osc.stop(t + 0.15);
                    });

                    // Sparkling high sine finish
                    let chimeOsc = audioCtx.createOscillator();
                    let chimeGain = audioCtx.createGain();
                    let tChime = now + 0.24;

                    chimeOsc.type = 'sine';
                    chimeOsc.frequency.setValueAtTime(1567.98, tChime); // G6
                    chimeOsc.frequency.exponentialRampToValueAtTime(2093.00, tChime + 0.3); // C7

                    chimeGain.gain.setValueAtTime(0.18, tChime);
                    chimeGain.gain.exponentialRampToValueAtTime(0.001, tChime + 0.3);

                    chimeOsc.connect(chimeGain);
                    chimeGain.connect(audioCtx.destination);
                    chimeOsc.start(tChime);
                    chimeOsc.stop(tChime + 0.3);
                } 
                else if (type === 'burst') {
                    // Deep explosion crash thud
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {
                console.log("Audio blocked or not supported", e);
            }
        }

        // Ambient Starfield
        const ambCanvas = document.getElementById("ambientCanvas");
        const ambCtx = ambCanvas.getContext("2d");
        let dustArray = [];

        function initAmbient() {
            ambCanvas.width = window.innerWidth;
            ambCanvas.height = window.innerHeight;
            dustArray = [];
            for (let i = 0; i < 60; i++) {
                dustArray.push({
                    x: Math.random() * ambCanvas.width,
                    y: Math.random() * ambCanvas.height,
                    size: Math.random() * 2.5 + 0.5,
                    vy: (Math.random() * 0.3 + 0.1) * -1,
                    alpha: Math.random() * 0.6 + 0.1
                });
            }
        }
        window.addEventListener('resize', initAmbient);
        initAmbient();

        function drawAmbient() {
            ambCtx.clearRect(0, 0, ambCanvas.width, ambCanvas.height);
            ambCtx.fillStyle = "#ffffff";
            dustArray.forEach(d => {
                ambCtx.globalAlpha = d.alpha;
                ambCtx.beginPath();
                ambCtx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                ambCtx.fill();
                d.y += d.vy;
                if (d.y < 0) d.y = ambCanvas.height;
            });
            requestAnimationFrame(drawAmbient);
        }
        drawAmbient();

        // Game State Engine
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let balance = 100.00;
        let currentBet = 10.00;
        let multiplier = 1.00;
        let nextMultiplier = 1.15;
        let stepCount = 0;
        let gameActive = false;
        let crashPoint = 1.50;
        let gameHistory = [];

        let balloonRadius = 50;
        let targetRadius = 50;
        let burstParticles = [];
        let cashParticles = [];
        let shockwaveR = 0;
        let shockwaveA = 0;
        let shakeTime = 0;

        function updateUI() {
            document.getElementById("balanceVal").innerText = balance.toFixed(2);
            document.getElementById("topMult").innerText = multiplier.toFixed(2) + "x";
            
            let payout = currentBet * multiplier;
            document.getElementById("winVal").innerText = payout.toFixed(2);
            document.getElementById("cashVal").innerText = payout.toFixed(2);
            document.getElementById("nextX").innerText = nextMultiplier.toFixed(2) + "x";
        }

        function appendHistory(mult, isWin) {
            gameHistory.unshift({ mult: mult, win: isWin });
            if (gameHistory.length > 20) gameHistory.pop();

            let bar = document.getElementById("historyBar");
            let html = '<span class="history-label">History:</span>';
            gameHistory.forEach(h => {
                let cls = h.win ? 'win' : 'bust';
                html += `<span class="history-pill ${cls}">${h.mult.toFixed(2)}x</span>`;
            });
            bar.innerHTML = html;
        }

        function setBet(amount) {
            if (gameActive) return;
            playSound('click');
            document.getElementById("betInput").value = amount;
        }

        function modBet(factor) {
            if (gameActive) return;
            playSound('click');
            let val = parseFloat(document.getElementById("betInput").value) || 0;
            document.getElementById("betInput").value = Math.max(1, Math.round(val * factor));
        }

        function startBet() {
            playSound('click');
            let inputVal = parseFloat(document.getElementById("betInput").value);
            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Please enter a valid bet amount.");
                return;
            }
            if (inputVal > balance) {
                alert("Insufficient wallet balance.");
                return;
            }

            currentBet = inputVal;
            balance -= currentBet;
            multiplier = 1.00;
            stepCount = 0;
            gameActive = true;
            targetRadius = 55;
            balloonRadius = 55;
            shockwaveA = 0;

            crashPoint = parseFloat((Math.random() * 4.5 + 1.25).toFixed(2));
            nextMultiplier = parseFloat((multiplier + (Math.random() * 0.22 + 0.12)).toFixed(2));

            document.getElementById("betBtn").style.display = "none";
            document.getElementById("pumpBtn").style.display = "block";
            document.getElementById("cashoutBtn").style.display = "block";
            
            let badge = document.getElementById("statusBadge");
            badge.innerText = "PRESSURIZING...";
            badge.style.color = "#00f2fe";

            updateUI();
        }

        function pumpAir() {
            if (!gameActive) return;
            playSound('pump');

            if (nextMultiplier >= crashPoint || Math.random() < 0.16) {
                triggerCrash();
                return;
            }

            multiplier = nextMultiplier;
            stepCount++;
            targetRadius += 12;

            let increment = Math.max(0.06, 0.32 - (stepCount * 0.02));
            nextMultiplier = parseFloat((multiplier + Math.random() * increment + 0.1).toFixed(2));

            updateUI();
        }

        function cashOut() {
            if (!gameActive) return;
            playSound('cashout');

            let winAmount = currentBet * multiplier;
            balance += winAmount;
            gameActive = false;

            shockwaveR = balloonRadius;
            shockwaveA = 1.0;
            appendHistory(multiplier, true);

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2 - 10;

            for (let i = 0; i < 45; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 9 + 2;
                cashParticles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 4,
                    life: 1.0,
                    decay: Math.random() * 0.018 + 0.01,
                    type: Math.random() > 0.4 ? 'coin' : 'text',
                    text: `+$${(winAmount / 25).toFixed(2)}`,
                    radius: Math.random() * 6 + 4,
                    color: Math.random() > 0.5 ? '#00e676' : '#00f2fe'
                });
            }

            let badge = document.getElementById("statusBadge");
            badge.innerText = `CASHED OUT +$${winAmount.toFixed(2)}`;
            badge.style.color = "#00e676";

            resetRoundUI();
        }

        function triggerCrash() {
            playSound('burst');

            gameActive = false;
            shakeTime = 20;
            targetRadius = 2;
            appendHistory(multiplier, false);

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2 - 10;

            for (let i = 0; i < 45; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 9 + 3;
                burstParticles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.025 + 0.015,
                    color: Math.random() > 0.3 ? '#ff2a5f' : '#ff0080'
                });
            }

            let badge = document.getElementById("statusBadge");
            badge.innerText = "OVERLOADED! BURST!";
            badge.style.color = "#ff2a5f";

            resetRoundUI();
        }

        function resetRoundUI() {
            document.getElementById("pumpBtn").style.display = "none";
            document.getElementById("cashoutBtn").style.display = "none";
            document.getElementById("betBtn").style.display = "block";
            document.getElementById("betBtn").innerText = "PLAY AGAIN";
            updateUI();
        }

        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            if (shakeTime > 0) {
                let sX = (Math.random() - 0.5) * 12;
                let sY = (Math.random() - 0.5) * 12;
                ctx.translate(sX, sY);
                shakeTime--;
            }

            balloonRadius += (targetRadius - balloonRadius) * 0.16;
            let wobble = Math.sin(Date.now() / 150) * (balloonRadius * 0.03);

            let cX = canvas.width / 2;
            let cY = canvas.height / 2 - 10;

            if (gameActive || balloonRadius > 10) {
                ctx.beginPath();
                ctx.moveTo(cX, cY + balloonRadius);
                ctx.quadraticCurveTo(cX + 15, cY + balloonRadius + 45, cX, cY + balloonRadius + 85);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#7928ca";
                ctx.beginPath();
                ctx.arc(cX, cY + balloonRadius, 6, 0, Math.PI * 2);
                ctx.fill();

                let gradient = ctx.createRadialGradient(
                    cX - balloonRadius * 0.3, 
                    cY - balloonRadius * 0.3, 
                    balloonRadius * 0.1, 
                    cX, 
                    cY, 
                    balloonRadius
                );
                gradient.addColorStop(0, '#00f2fe');
                gradient.addColorStop(0.4, '#7928ca');
                gradient.addColorStop(1, '#ff0080');

                ctx.shadowColor = "#ff0080";
                ctx.shadowBlur = Math.min(50, balloonRadius * 0.8);

                ctx.beginPath();
                ctx.ellipse(cX, cY, balloonRadius + wobble, balloonRadius - wobble, 0, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.ellipse(cX - balloonRadius * 0.35, cY - balloonRadius * 0.35, balloonRadius * 0.28, balloonRadius * 0.14, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                ctx.fill();
            }

            for (let i = burstParticles.length - 1; i >= 0; i--) {
                let bp = burstParticles[i];
                bp.x += bp.vx;
                bp.y += bp.vy;
                bp.life -= bp.decay;

                ctx.beginPath();
                ctx.arc(bp.x, bp.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = bp.color;
                ctx.globalAlpha = bp.life;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (bp.life <= 0) burstParticles.splice(i, 1);
            }

            for (let i = cashParticles.length - 1; i >= 0; i--) {
                let cp = cashParticles[i];
                cp.x += cp.vx;
                cp.y += cp.vy;
                cp.vy += 0.18;
                cp.life -= cp.decay;

                ctx.save();
                ctx.globalAlpha = cp.life;
                if (cp.type === 'coin') {
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, cp.radius, 0, Math.PI * 2);
                    ctx.fillStyle = cp.color;
                    ctx.shadowColor = cp.color;
                    ctx.shadowBlur = 12;
                    ctx.fill();
                } else {
                    ctx.font = "800 15px 'Plus Jakarta Sans', sans-serif";
                    ctx.fillStyle = "#00e676";
                    ctx.shadowColor = "#00e676";
                    ctx.shadowBlur = 10;
                    ctx.fillText(cp.text, cp.x, cp.y);
                }
                ctx.restore();

                if (cp.life <= 0) cashParticles.splice(i, 1);
            }

            if (shockwaveA > 0) {
                ctx.beginPath();
                ctx.arc(cX, cY, shockwaveR, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 230, 118, ${shockwaveA})`;
                ctx.lineWidth = 5;
                ctx.stroke();
                shockwaveR += 6;
                shockwaveA -= 0.03;
            }

            ctx.restore();
            requestAnimationFrame(renderScene);
        }

        updateUI();
        renderScene();
    </script>
</body>
</html>
