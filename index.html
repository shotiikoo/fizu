<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0ea5e9;
        }
        .balance-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- REGISTRATION SECTION -->
        <div id="register-section">
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="regUser" placeholder="Username (e.g., alexmartin)" required />
                <input type="email" id="regEmail" placeholder="Email (e.g., alexmartin@gmail.com)" required />
                <input type="password" id="regPass" placeholder="Password" required />
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" style="display:none;">
            <h2>Welcome, <span id="displayUsername"></span></h2>
            <div class="balance-box">
                <h3>Balance</h3>
                <p style="font-size: 24px; font-weight: bold; color: #4ade80; margin: 0;">$<span id="displayBalance">0.00</span></p>
            </div>

            <!-- Game Actions -->
            <button onclick="playGame('win')" style="background: #22c55e; color: #fff;">Simulate Win (+10)</button>
            <button onclick="playGame('loss')" style="background: #ef4444; color: #fff;">Simulate Loss (-10)</button>
        </div>
    </div>

<script>
    let currentUserId = null;

    // Handle Registration Submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('regUser').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await response.json();

            if (data.success) {
                currentUserId = data.user.id;
                document.getElementById('register-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('displayUsername').innerText = data.user.username;
                document.getElementById('displayBalance').innerText = Number(data.user.balance).toFixed(2);
            } else {
                alert(data.message || 'Registration failed');
            }
        } catch (err) {
            console.error('Error:', err);
            alert('An error occurred during registration.');
        }
    });

    // Handle Game Win/Loss with Real-time Balance Update
    async function playGame(outcome) {
        if (!currentUserId) return;

        try {
            const response = await fetch('/api/game/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    betAmount: 10,
                    outcome: outcome
                })
            });
            const data = await response.json();

            if (data.success) {
                document.getElementById('displayBalance').innerText = Number(data.newBalance).toFixed(2);
            }
        } catch (err) {
            console.error('Error:', err);
        }
    }
</script>

</body>
</html>
