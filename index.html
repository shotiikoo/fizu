<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platform</title>
</head>
<body>

    <!-- REGISTRATION FORM -->
    <div id="register-section">
        <h2>Register</h2>
        <form id="registerForm">
            <!-- FIXED: Changed to alexmartin examples -->
            <input type="text" id="regUser" placeholder="e.g., alexmartin" required />
            <input type="email" id="regEmail" placeholder="alexmartin@gmail.com" required />
            <input type="password" id="regPass" placeholder="Password" required />
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <!-- GAME / DASHBOARD SECTION (Real-time balance display) -->
    <div id="dashboard-section" style="display:none;">
        <h2>Welcome, <span id="displayUsername"></span></h2>
        <h3>Balance: $<span id="displayBalance">0.00</span></h3>

        <!-- Example Game Buttons -->
        <button onclick="playGame('win')">Simulate Win (+10)</button>
        <button onclick="playGame('loss')">Simulate Loss (-10)</button>
    </div>

<script>
    let currentUserId = null;

    // Handle Registration Submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('regUser').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;

        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await response.json();

        if (data.success) {
            currentUserId = data.user.id;
            // Switch view to dashboard and show balance (starts at 0)
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('displayUsername').innerText = data.user.username;
            document.getElementById('displayBalance').innerText = data.user.balance.toFixed(2);
        }
    });

    // Handle Game Win/Loss with Real-time Balance Update
    async function playGame(outcome) {
        if (!currentUserId) return;

        const response = await fetch('/api/game/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: currentUserId,
                betAmount: 10,
                outcome: outcome
            })
        });
        const data = await response.json();

        if (data.success) {
            // Immediately update frontend balance without needing re-login
            document.getElementById('displayBalance').innerText = data.newBalance.toFixed(2);
        }
    }
</script>

</body>
</html>
