<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Web Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <h2>Create an Account</h2>
        <p class="subtitle">Join the platform to manage your balance & deposits</p>
        
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn primary-btn full-width">Register</button>
        </form>

        <p class="auth-redirect">Already have an account? <a href="login.html">Log In</a></p>
        <p class="auth-redirect" style="margin-top: 0.5rem;"><a href="index.html">← Back to Home</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
